<div class="profile-grid" *ngIf="user as u">

  <div class="right-column">
    <div class="card-surface panel">
      <span class="panel-label">Personal Information</span>

      <div class="form-group">
        <label>Username</label>
        <input class="input-obsidian" [value]="u.username" disabled />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input class="input-obsidian" [value]="u.email" disabled />
        <p class="hint-small">Email cannot be changed directly. Contact support.</p>
      </div>

      <p class="hint-small">
        Profile editing isn't available yet — user-service has no controller/entity implemented on the backend.
      </p>

      <div class="form-actions">
        <button class="btn-secondary" disabled>Cancel</button>
        <button class="btn-primary" disabled>
          <span class="material-symbols-outlined icon-sm">save</span>
          Save Changes
        </button>
      </div>
    </div>
  </div>
</div>
